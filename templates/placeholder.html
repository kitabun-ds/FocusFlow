{% extends "base.html" %}

{% block title %}{{ page_title }} — FocusFlow{% endblock %}

{% block content %}

<main style="
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
">

    <div style="
        text-align: center;
        max-width: 500px;
    ">

        <p style="
            margin: 0 0 8px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.16em;
            color: #75777e;
            text-transform: uppercase;
        ">
            FOCUSFLOW
        </p>

        <h1 style="
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 500;
            color: #000a24;
        ">
            {{ page_title }}
        </h1>

        <p style="
            margin: 12px 0 0;
            color: #75777e;
            font-size: 13px;
            line-height: 1.6;
        ">
            This page is currently being built.
        </p>

    </div>

</main>

{% endblock %}
