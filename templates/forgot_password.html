<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password — FocusFlow</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #8fd9e8;
            overflow: hidden;
        }

        .page {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100svh;
            overflow: hidden;
            isolation: isolate;
        }

        .ocean-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            z-index: -3;
        }

        .light-overlay {
            position: absolute;
            inset: 0;
            z-index: -2;
            background:
                linear-gradient(
                    180deg,
                    rgba(0, 53, 76, 0.05) 0%,
                    rgba(255, 255, 255, 0.02) 50%,
                    rgba(0, 52, 72, 0.09) 100%
                );
        }

        .center-light {
            position: absolute;
            width: 70vw;
            height: 70vh;
            left: 50%;
            top: 48%;
            transform: translate(-50%, -50%);
            background:
                radial-gradient(
                    ellipse,
                    rgba(255, 255, 255, 0.16) 0%,
                    rgba(255, 255, 255, 0.05) 48%,
                    transparent 75%
                );
            filter: blur(30px);
            pointer-events: none;
            z-index: -1;
        }

        .back-link {
            position: absolute;
            top: 30px;
            left: 34px;
            z-index: 20;
            color: rgba(255, 255, 255, 0.95);
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            text-shadow:
                0 2px 10px rgba(0, 42, 62, 0.30);
        }

        .card-area {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .card {
            width: min(430px, 92vw);
            padding: 42px 38px 34px;
            border: 1px solid rgba(255, 255, 255, 0.38);
            border-radius: 26px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.22),
                    rgba(255, 255, 255, 0.10)
                );
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            box-shadow:
                0 24px 70px rgba(0, 46, 67, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.40);
            animation:
                cardReveal
                0.75s
                cubic-bezier(.22, .75, .2, 1)
                forwards;
            opacity: 0;
            transform:
                translateY(18px)
                scale(0.985);
        }

        .heading {
            text-align: center;
            color: white;
            text-shadow:
                0 3px 18px rgba(0, 43, 65, 0.24);
        }

        .heading h1 {
            font-family:
                "Cormorant Garamond",
                serif;
            font-size: 48px;
            font-weight: 600;
            line-height: 0.95;
        }

        .heading p {
            margin-top: 12px;
            font-size: 12px;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.92);
        }

        .form {
            margin-top: 30px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: rgba(255, 255, 255, 0.94);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.07em;
            text-transform: uppercase;
        }

        .field input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 12px;
            outline: none;
            background: rgba(255, 255, 255, 0.14);
            color: white;
            font-family: "Inter", sans-serif;
            font-size: 13px;
        }

        .field input::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        .field input:focus {
            border-color: rgba(255, 255, 255, 0.72);
            background: rgba(255, 255, 255, 0.19);
            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.08);
        }

        .message {
            margin-top: 20px;
            margin-bottom: 18px;
            padding: 11px 13px;
            border-radius: 10px;
            font-size: 11px;
            line-height: 1.45;
            text-align: center;
            color: white;
            background: rgba(0, 55, 75, 0.20);
            border: 1px solid rgba(255, 255, 255, 0.20);
        }

        .reset-button {
            width: 100%;
            height: 51px;
            border: none;
            border-radius: 12px;
            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.94),
                    rgba(255, 255, 255, 0.78)
                );
            color: #07556b;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow:
                0 9px 28px rgba(0, 48, 70, 0.14);
            transition: transform 0.25s ease;
        }

        .reset-button:hover {
            transform: translateY(-2px);
        }

        .login-text {
            margin-top: 21px;
            text-align: center;
            color: rgba(255, 255, 255, 0.90);
            font-size: 11px;
        }

        .login-text a {
            color: white;
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        @keyframes cardReveal {

            0% {
                opacity: 0;
                transform:
                    translateY(18px)
                    scale(0.985);
            }

            100% {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }

        }

        @media (max-width: 700px) {

            .back-link {
                top: 22px;
                left: 22px;
            }

            .card {
                padding:
                    36px 25px 29px;
            }

            .heading h1 {
                font-size: 43px;
            }

        }

    </style>

</head>


<body>

<main class="page">

    <video
        id="oceanVideo"
        class="ocean-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
    >

        <source
            src="{{ url_for('static', filename='images/ocean-crystal.mp4') }}"
            type="video/mp4"
        >

    </video>

    <div class="light-overlay"></div>

    <div class="center-light"></div>


    <a
        href="{{ url_for('login') }}"
        class="back-link"
    >
        ← Back
    </a>


    <section class="card-area">

        <div class="card">

            <div class="heading">

                <h1>
                    Forgot password?
                </h1>

                <p>
                    Enter your email and we'll send you<br>
                    a secure password-reset link.
                </p>

            </div>


            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="message">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form
                class="form"
                method="POST"
                action="{{ url_for('forgot_password') }}"
            >

                <div class="field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        maxlength="254"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="reset-button"
                >
                    Send Reset Link
                </button>

            </form>


            <div class="login-text">

                Remember your password?

                <a href="{{ url_for('login') }}">
                    Log in
                </a>

            </div>

        </div>

    </section>

</main>


<script>

const oceanVideo =
    document.getElementById("oceanVideo");

if (oceanVideo) {

    oceanVideo.muted = true;

    const startVideo = () => {

        const playPromise =
            oceanVideo.play();

        if (
            playPromise !== undefined
        ) {

            playPromise.catch(() => {});

        }

    };

    document.addEventListener(
        "DOMContentLoaded",
        startVideo
    );

    window.addEventListener(
        "load",
        startVideo
    );

}

</script>

</body>

</html>
